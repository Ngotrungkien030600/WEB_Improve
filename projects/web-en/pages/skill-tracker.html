<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Tracker — SkillForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/timer.css" />
  <link rel="stylesheet" href="css/forge-tokens.css" />
  <link rel="stylesheet" href="../css/subpage.css" />
  <link rel="stylesheet" href="../css/features/skill-tracker.css" />
  <link rel="stylesheet" href="../css/motivation.css" />
</head>
<body class="subpage">
  <div class="sk-container">
    <header class="sk-header">
      <div class="sk-header-row">
        <div>
          <h1>📊 Skill Tracker</h1>
          <p>Theo dõi hành trình học tập của bạn</p>
        </div>
        <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;">
          <div class="forge-timer-wrap">
            <div class="forge-timer-ring">
              <svg viewBox="0 0 68 68">
                <circle class="forge-ring-bg" cx="34" cy="34" r="30" />
                <circle class="forge-ring-progress" id="forge-ring-progress" cx="34" cy="34" r="30" />
              </svg>
              <div class="forge-time" id="forge-time">30:00</div>
            </div>
            <div class="forge-controls">
              <select id="forge-select">
                <option value="30">30p</option>
                <option value="60">1h</option>
              </select>
              <div class="forge-btn-row">
                <button class="forge-btn forge-btn-primary" id="forge-toggle">⚒️</button>
                <button class="forge-btn forge-btn-secondary" id="forge-reset">↻</button>
              </div>
            </div>
            <div class="forge-stats">
              <div class="forge-stat-row">📋 Hôm nay <span class="val fire" id="stat-today">0m</span></div>
              <div class="forge-stat-row">🔥 Streak <span class="val" id="stat-streak">0🔥</span></div>
              <div class="forge-stat-row">📦 Đã rèn <span class="val" id="stat-total">0</span></div>
            </div>
          </div>
          <a class="sk-back-link" href="../index.html">⬅ Trang chủ</a>
        </div>
      </div>
      <!-- Stats bar -->
      <div class="sk-stats-bar">
        <div class="sk-stat"><span class="sk-stat-value" id="sk-total-xp">0</span><span class="sk-stat-label">Tổng XP</span></div>
        <div class="sk-stat"><span class="sk-stat-value" id="sk-streak">🔥 0</span><span class="sk-stat-label">Streak</span></div>
        <div class="sk-stat"><span class="sk-stat-value" id="sk-today">⏱ 0</span><span class="sk-stat-label">Hôm nay</span></div>
      </div>
    </header>

    <div class="sk-layout">
      <!-- Left: Skill tree -->
      <div class="sk-main">
        <h2>🎯 Kỹ năng</h2>
        <div id="sk-category-grid" class="sk-category-grid"></div>
        <div id="sk-skills-container"></div>
      </div>

      <!-- Right: Practice log -->
      <aside class="sk-sidebar">
        <div id="sk-practice-form"></div>
        <div id="sk-heatmap" class="sk-heatmap"></div>
        <div id="sk-log" class="sk-log"></div>
      </aside>
    </div>

    <footer class="app-footer">
      <p>© 2026 SkillForge — Skill Tracker</p>
    </footer>
  </div>

  <script src="../js/utils/timer.js"></script>
  <script src="../js/data/motivation-quotes.js"></script>
  <script src="../js/motivation-popup.js"></script>
  <script src="../js/data/data-meta.js"></script>
  <script src="../js/data/learning-path-data.js"></script>
  <script src="../js/data/search-index.js"></script>
  <script src="../js/data/spaced-repetition.js"></script>
  <script src="../js/data/progress-db.js"></script>
  <script type="module" src="../js/skill-app.js"></script>
</body>
</html>
