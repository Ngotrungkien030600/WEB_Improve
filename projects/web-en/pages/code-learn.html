<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillForge — Học Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/timer.css" />
  <link rel="stylesheet" href="../css/learn.css" />
</head>
<body class="learn-page">
  <div class="learn-page-container">
    <header class="learn-topbar">
      <h1>💻 Học Code</h1>
      <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;">
        <div class="focus-timer" id="focus-timer">
          <div class="time-display" id="timer-display">30:00</div>
          <div class="timer-controls">
            <select id="timer-select">
              <option value="30">30p</option>
              <option value="60">1h</option>
            </select>
            <button id="timer-toggle">▶</button>
            <button id="timer-reset">↻</button>
          </div>
        </div>
        <a class="back-link" href="../index.html">⬅ Quay lại Trang chủ</a>
      </div>
    </header>

    <div class="learn-layout">
      <aside class="learn-sidebar">
        <h3>📚 Bài học</h3>
        <ul class="learn-topic-list" id="learn-topic-list"></ul>
        <div class="learn-progress">
          <span id="learn-progress-text">Tiến độ: 0 / 0</span>
          <div class="learn-progress-bar"><div id="learn-progress-fill"></div></div>
        </div>
      </aside>
      <div class="learn-content-wrapper">
        <div class="learn-card" id="learn-card">
          <h2 id="learn-topic-title">Chọn một bài học</h2>
          <div id="learn-topic-body"></div>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <p>© 2026 SkillForge — Học Code</p>
    </footer>
  </div>

  <script src="../js/utils/timer.js"></script>
  <script src="../js/data/data-meta.js"></script>
  <script src="../js/data/learning-path-data.js"></script>
  <script src="../js/data/search-index.js"></script>
  <script src="../js/data/spaced-repetition.js"></script>
  <script src="../js/data/progress-db.js"></script>
  <script src="../js/data/learn-data.js"></script>
  <script type="module" src="../js/learn-app.js"></script>
</body>
</html>
