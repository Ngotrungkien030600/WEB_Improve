<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔀 Xếp chữ — SkillForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/subpage.css" />
  <link rel="stylesheet" href="../css/timer.css" />
  <link rel="stylesheet" href="css/forge-tokens.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body class="subpage">
<div class="subpage-container">
  <!-- Topbar -->
  <header class="subpage-topbar">
    <div class="subpage-topbar-left">
      <span class="icon">🔀</span>
      <h1>Xếp chữ</h1>
    </div>
    <div class="subpage-topbar-right">
      <div class="forge-timer-wrap">
        <div class="forge-timer-ring">
          <svg viewBox="0 0 68 68">
            <circle class="forge-ring-bg" cx="34" cy="34" r="30" />
            <circle class="forge-ring-progress" id="forge-ring-progress" cx="34" cy="34" r="30" />
          </svg>
          <div class="forge-time" id="forge-time">30:00</div>
        </div>
        <div class="forge-controls">
          <select id="forge-select">
            <option value="30">30p</option>
            <option value="60">1h</option>
          </select>
          <div class="forge-btn-row">
            <button class="forge-btn forge-btn-primary" id="forge-toggle">⚒️</button>
            <button class="forge-btn forge-btn-secondary" id="forge-reset">↻</button>
          </div>
        </div>
        <div class="forge-stats">
          <div class="forge-stat-row">📋 Hôm nay <span class="val fire" id="stat-today">0m</span></div>
          <div class="forge-stat-row">🔥 Streak <span class="val" id="stat-streak">0🔥</span></div>
          <div class="forge-stat-row">📦 Đã rèn <span class="val" id="stat-total">0</span></div>
        </div>
      </div>
      <a class="subpage-back" href="english.html">⬅ Tiếng Anh</a>
    </div>
  </header>

  <div class="subpage-content">
    <div class="game-header">
      <h2>🔀 Xếp chữ</h2>
      <div class="game-stats">
        <span>Điểm: <strong id="scramble-score">0</strong></span>
        <span>Đã làm: <strong id="scramble-count">0/10</strong></span>
      </div>
    </div>
    <div class="scramble-card">
      <p class="scramble-hint" id="scramble-hint">👆 Bấm vào chữ để xếp</p>
      <div class="scramble-letters" id="scramble-letters"></div>
      <div class="scramble-answer" id="scramble-answer"></div>
      <p class="scramble-meaning" id="scramble-meaning"></p>
      <div class="practice-actions">
        <button id="scramble-check">✅ Kiểm tra</button>
        <button id="scramble-next">Tiếp ➡️</button>
      </div>
      <div class="practice-feedback" id="scramble-feedback"></div>
    </div>
  </div>

  <footer class="subpage-footer">
    <p>© 2026 SkillForge</p>
  </footer>
</div>

<script src="../js/utils/timer.js"></script>
<script src="../js/data/data-meta.js"></script>
<script src="../js/data/search-index.js"></script>
<script src="../js/data/spaced-repetition.js"></script>
<script src="../js/data/progress-db.js"></script>
<script type="module">
  import { initScrambleUI } from '../js/features/game/game-scramble-ui.js';
  document.addEventListener('DOMContentLoaded', () => initScrambleUI());
</script>
</body>
</html>
