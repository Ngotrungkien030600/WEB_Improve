<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🃏 Ghép cặp từ vựng — SkillForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/subpage.css" />
  <link rel="stylesheet" href="../css/timer.css" />
  <link rel="stylesheet" href="css/forge-tokens.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body class="subpage">
<div class="subpage-container">
  <!-- Topbar -->
  <header class="subpage-topbar">
    <div class="subpage-topbar-left">
      <span class="icon">🃏</span>
      <h1>Ghép cặp từ vựng</h1>
    </div>
    <div class="subpage-topbar-right">
      <div class="forge-timer-wrap">
        <div class="forge-timer-ring">
          <svg viewBox="0 0 68 68">
            <circle class="forge-ring-bg" cx="34" cy="34" r="30" />
            <circle class="forge-ring-progress" id="forge-ring-progress" cx="34" cy="34" r="30" />
          </svg>
          <div class="forge-time" id="forge-time">30:00</div>
        </div>
        <div class="forge-controls">
          <select id="forge-select">
            <option value="30">30p</option>
            <option value="60">1h</option>
          </select>
          <div class="forge-btn-row">
            <button class="forge-btn forge-btn-primary" id="forge-toggle">⚒️</button>
            <button class="forge-btn forge-btn-secondary" id="forge-reset">↻</button>
          </div>
        </div>
        <div class="forge-stats">
          <div class="forge-stat-row">📋 Hôm nay <span class="val fire" id="stat-today">0m</span></div>
          <div class="forge-stat-row">🔥 Streak <span class="val" id="stat-streak">0🔥</span></div>
          <div class="forge-stat-row">📦 Đã rèn <span class="val" id="stat-total">0</span></div>
        </div>
      </div>
      <a class="subpage-back" href="english.html"><svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Tiếng Anh</a>
    </div>
  </header>

  <div class="subpage-content">
    <div class="game-header">
      <h2>🃏 Ghép cặp từ vựng</h2>
      <div class="game-stats">
        <span>Điểm: <strong id="game-score">0</strong></span>
        <span>Bước: <strong id="game-moves">0</strong></span>
        <span>Thời gian: <strong id="game-time">00:00</strong></span>
      </div>
    </div>
    <p class="game-feedback" id="game-feedback">Tìm các cặp từ vựng Anh - Việt!</p>
    <div class="game-board" id="game-board"></div>
    <div style="text-align:center;">
      <button class="btn-restart" id="game-restart">🔄 Chơi lại</button>
    </div>
  </div>

  <footer class="subpage-footer">
    <p>© 2026 SkillForge</p>
  </footer>
</div>

<script src="../js/utils/timer.js"></script>
<script src="../js/data/data-meta.js"></script>
<script src="../js/data/search-index.js"></script>
<script src="../js/data/spaced-repetition.js"></script>
<script src="../js/data/progress-db.js"></script>
<script type="module">
  import { initGameUI } from '../js/features/game/game-ui.js';
  document.addEventListener('DOMContentLoaded', () => initGameUI());
</script>
</body>
</html>
