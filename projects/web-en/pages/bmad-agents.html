<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMAD Agents — SkillForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/forge-tokens.css" />
  <link rel="stylesheet" href="../css/subpage.css" />
  <link rel="stylesheet" href="../css/timer.css" />
  <link rel="stylesheet" href="../css/agents/bmad-chat.css" />
</head>
<body class="subpage">
<div class="page">
  <div class="topbar">
    <h1>🗣️ BMAD Agents</h1>
    <a class="back" href="../index.html">← Trang chủ</a>
  </div>
  <p class="desc">7 trợ lý AI — chọn 1 để trò chuyện, hoặc Party Mode thảo luận đa chiều.</p>
  <div class="mode-bar" id="bmad-mode-bar">
    <button class="bmad-mode-btn active" data-mode="solo">🧑‍💻 Trò chuyện 1-1</button>
    <button class="bmad-mode-btn" data-mode="party">🎉 Party Mode</button>
  </div>
  <div class="agent-grid" id="bmad-agent-grid"></div>
  <div class="party-start" id="bmad-party-start" style="display:none;">
    <button id="bmad-party-select-all-btn">✅ Chọn tất cả</button>
    <button id="bmad-party-start-btn">🎉 Bắt đầu Party</button>
  </div>
  <div class="session-info" id="bmad-session-info" style="display:none;">
    <span class="session-label" id="bmad-session-label">Đang trò chuyện</span>
    <button class="back-btn" id="bmad-back-btn">← Danh sách</button>
    <button class="clear-btn" id="bmad-clear-btn">🗑️</button>
  </div>
  <div class="chat-box" id="bmad-chat-messages" style="display:none;"></div>
  <div class="input-row">
    <textarea id="bmad-chat-input" rows="2" placeholder="Nhập câu hỏi..." maxlength="2000" style="display:none;"></textarea>
    <button id="bmad-send-btn" style="display:none;">➤</button>
  </div>
</div>
<script src="../js/agents/agent-constants.js"></script>
<script src="../js/agents/agents-config.js"></script>
<script src="../js/agents/bmad-chat.js"></script>
</body>
</html>
