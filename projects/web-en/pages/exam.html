<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thi Tiếng Anh — SkillForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/subpage.css" />
  <link rel="stylesheet" href="../css/timer.css" />
  <link rel="stylesheet" href="../css/exam.css" />
</head>
<body class="subpage exam-page">
<div class="subpage-container">
  <!-- Topbar -->
  <header class="subpage-topbar">
    <div class="subpage-topbar-left">
      <span class="icon">📝</span>
      <div>
        <h1>Thi Tiếng Anh</h1>
        <div class="subtitle">Kiểm tra từ vựng, ngữ pháp &amp; khả năng đặt câu</div>
      </div>
    </div>
    <div class="subpage-topbar-right">
      <div class="forge-timer-wrap">
        <div class="forge-timer-ring">
          <svg viewBox="0 0 68 68">
            <circle class="forge-ring-bg" cx="34" cy="34" r="30" />
            <circle class="forge-ring-progress" id="forge-ring-progress" cx="34" cy="34" r="30" />
          </svg>
          <div class="forge-time" id="forge-time">30:00</div>
        </div>
        <div class="forge-controls">
          <select id="forge-select">
            <option value="30">30p</option>
            <option value="60">1h</option>
          </select>
          <div class="forge-btn-row">
            <button class="forge-btn forge-btn-primary" id="forge-toggle">⚒️</button>
            <button class="forge-btn forge-btn-secondary" id="forge-reset">↻</button>
          </div>
        </div>
        <div class="forge-stats">
          <div class="forge-stat-row">📋 Hôm nay <span class="val fire" id="stat-today">0m</span></div>
          <div class="forge-stat-row">🔥 Streak <span class="val" id="stat-streak">0🔥</span></div>
          <div class="forge-stat-row">📦 Đã rèn <span class="val" id="stat-total">0</span></div>
        </div>
      </div>
      <a class="subpage-back" href="english.html">⬅ Tiếng Anh</a>
    </div>
  </header>

  <div class="subpage-content">
    <!-- Topic selector & config -->
    <section class="subpage-card exam-config">
      <div class="exam-config-row">
        <label>Chủ đề:</label>
        <div class="exam-topic-tabs" id="exam-topic-tabs">
          <button class="exam-topic-tab active" data-quiz="vocab">📝 Từ vựng</button>
          <button class="exam-topic-tab" data-quiz="sentence">✍️ Đặt câu</button>
          <button class="exam-topic-tab" data-quiz="tense">⏰ Nhận diện thì</button>
        </div>
      </div>
      <div class="exam-config-row">
        <label>Số câu:</label>
        <select id="exam-question-count">
          <option value="5">5 câu</option>
          <option value="10" selected>10 câu</option>
          <option value="15">15 câu</option>
          <option value="20">20 câu</option>
        </select>
        <label>Thời gian:</label>
        <select id="exam-time-mode">
          <option value="per-question" selected>Theo từng câu</option>
          <option value="total">Tổng toàn bài</option>
          <option value="unlimited">Không giới hạn</option>
        </select>
        <select id="exam-time-limit">
          <option value="10">10s</option>
          <option value="15" selected>15s</option>
          <option value="20">20s</option>
          <option value="30">30s</option>
        </select>
        <button class="exam-btn-start" id="exam-start">▶️ Bắt đầu thi</button>
      </div>
    </section>

    <!-- Timer bar -->
    <div class="exam-timer-bar" id="exam-timer-bar">
      <div class="exam-timer-fill" id="exam-timer-fill"></div>
    </div>
    <p class="exam-timer-text" id="exam-timer-text">Thời gian còn lại: --</p>

    <!-- Active exam area -->
    <section class="subpage-card exam-card" id="exam-card">
      <div class="exam-card-header">
        <span class="exam-badge" id="exam-badge">Từ vựng</span>
        <span class="exam-progress" id="exam-progress">Câu 1 / 10</span>
      </div>
      <h2 class="exam-question" id="exam-question">Question</h2>
      <p class="exam-hint" id="exam-hint">Hint</p>
      <div class="exam-options" id="exam-options"></div>
      <div class="exam-feedback" id="exam-feedback"></div>
      <div class="exam-actions">
        <button class="exam-btn-next" id="exam-btn-next">Câu tiếp theo ➡️</button>
      </div>
    </section>

    <!-- Stats -->
    <section class="subpage-card exam-stats" id="exam-stats">
      <div class="exam-stat">
        <span class="exam-stat-value" id="exam-score">0</span>
        <span class="exam-stat-label">Đúng</span>
      </div>
      <div class="exam-stat">
        <span class="exam-stat-value" id="exam-total">0</span>
        <span class="exam-stat-label">Tổng</span>
      </div>
      <div class="exam-stat">
        <span class="exam-stat-value" id="exam-pct">0%</span>
        <span class="exam-stat-label">Tỉ lệ</span>
      </div>
      <div class="exam-stat">
        <span class="exam-stat-value" id="exam-level">--</span>
        <span class="exam-stat-label">Trình độ</span>
      </div>
    </section>

    <!-- History -->
    <section class="subpage-card exam-history">
      <h3>📜 Lịch sử thi</h3>
      <ul id="exam-history-list"></ul>
    </section>
  </div>

  <footer class="subpage-footer">
    <p>© 2026 SkillForge</p>
  </footer>
</div>

<script src="../js/utils/timer.js"></script>
<script src="../js/data/data-meta.js"></script>
<script src="../js/data/search-index.js"></script>
<script src="../js/data/spaced-repetition.js"></script>
<script src="../js/data/progress-db.js"></script>
<script type="module" src="../js/exam-app.js"></script>
</body>
</html>
