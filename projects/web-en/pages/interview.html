<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Java Backend Interview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/timer.css" />
  <link rel="stylesheet" href="css/forge-tokens.css" />
  <link rel="stylesheet" href="../css/subpage.css" />
  <link rel="stylesheet" href="../css/interview.css" />
  <style>
    html, body {
      min-height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 0;
    }
    .interview-page-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      padding: 1rem;
      box-sizing: border-box;
    }
    .interview-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      padding: 0.5rem 0;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .interview-topbar h1 {
      font-size: 1.85rem;
    }
    .interview-topbar .back-link {
      background: white;
      color: #764ba2;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .interview-topbar .back-link:hover {
      background: #f3e5f5;
    }
    .interview-layout {
      flex: 1;
      min-height: 0;
      align-items: flex-start;
    }
    .interview-card {
      max-height: none;
      height: auto;
      min-height: calc(100vh - 8rem);
      overflow-x: auto;
    }
    .app-footer {
      margin-top: 0.5rem;
      text-align: center;
    }
    @media (max-width: 800px) {
      .interview-layout { max-height: none; }
      .interview-sidebar { max-height: 35vh; height: auto; }
      .interview-card { height: auto; }
    }
  </style>
</head>
<body class="subpage">
  <div class="interview-page-container">
    <header class="interview-topbar">
      <h1>☕ Java Backend Interview</h1>
      <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;">
        <div class="forge-timer-wrap">
          <div class="forge-timer-ring">
            <svg viewBox="0 0 68 68">
              <circle class="forge-ring-bg" cx="34" cy="34" r="30" />
              <circle class="forge-ring-progress" id="forge-ring-progress" cx="34" cy="34" r="30" />
            </svg>
            <div class="forge-time" id="forge-time">30:00</div>
          </div>
          <div class="forge-controls">
            <select id="forge-select">
              <option value="30">30p</option>
              <option value="60">1h</option>
            </select>
            <div class="forge-btn-row">
              <button class="forge-btn forge-btn-primary" id="forge-toggle">⚒️</button>
              <button class="forge-btn forge-btn-secondary" id="forge-reset">↻</button>
            </div>
          </div>
          <div class="forge-stats">
            <div class="forge-stat-row">📋 Hôm nay <span class="val fire" id="stat-today">0m</span></div>
            <div class="forge-stat-row">🔥 Streak <span class="val" id="stat-streak">0🔥</span></div>
            <div class="forge-stat-row">📦 Đã rèn <span class="val" id="stat-total">0</span></div>
          </div>
        </div>
        <a class="back-link" href="../index.html">⬅ Quay lại Trang chủ</a>
      </div>
    </header>

    <div class="interview-layout">
      <aside class="interview-sidebar">
        <h3>📑 Chủ đề</h3>
        <ul class="interview-topic-list" id="interview-topic-list"></ul>
        <div class="interview-progress">
          <span id="interview-progress-text">Tiến độ: 0 / 0</span>
          <div class="interview-progress-bar"><div id="interview-progress-fill"></div></div>
        </div>
      </aside>
      <div class="interview-content-wrapper">
        <div class="interview-card" id="interview-card">
          <h2 id="interview-topic-title">Chọn một chủ đề</h2>
          <div id="interview-topic-body"></div>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <p>© 2026 Java Backend Interview</p>
    </footer>
  </div>

  <script src="../js/utils/timer.js"></script>
  <script src="../js/data/data-meta.js"></script>
  <script src="../js/data/search-index.js"></script>
  <script src="../js/data/spaced-repetition.js"></script>
  <script src="../js/data/progress-db.js"></script>
  <script src="../js/data/interview-data.js"></script>
  <script type="module" src="../js/interview-app.js"></script>
</body>
</html>
